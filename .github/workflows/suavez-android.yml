name: Suavez Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "suavez/android/**"
      - ".github/workflows/suavez-android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gerar APK
        run: gradle -p suavez/android :app:assembleDebug --no-daemon
      - name: Preparar instalação
        run: cp suavez/android/app/build/outputs/apk/debug/app-debug.apk suavez.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: suavez-android
          path: suavez.apk
      - name: Publicar instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: suavez-v1
          name: Suavez para Android
          files: suavez.apk
          make_latest: true
          overwrite_files: true
          body: "Instale o APK no Android. Configure a última data de aplicação e permita notificações. Sem conta ou servidor."
