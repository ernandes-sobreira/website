<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f6">
  <title>Suavez · um lembrete, só isso</title>
  <meta name="description" content="Suavez: lembrete simples a cada 10 dias para Android.">
  <style>
    :root {color-scheme:light; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f8f9f6;color:#233630}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:100%;max-width:355px;text-align:center}
    .mark{width:72px;height:72px;margin:0 auto 30px;display:grid;place-items:center;border-radius:22px;background:#295d4d;color:white;font-size:43px;font-weight:700;letter-spacing:-.07em}
    h1{font-size:43px;letter-spacing:-.055em;margin:0;color:#295d4d;font-weight:650}
    p{margin:13px 0 42px;color:#78867d;font-size:17px;line-height:1.5}
    a{display:block;text-decoration:none;padding:20px 12px;border-radius:17px;background:#295d4d;color:#fff;font-size:17px;font-weight:600}
    a:focus-visible{outline:4px solid #78b9a6;outline-offset:4px}
    small{display:block;margin-top:25px;line-height:1.8;color:#78867d;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">s.</div>
    <h1>suavez.</h1>
    <p>Um lembrete a cada 10 dias.<br>Só isso.</p>
    <a href="https://github.com/ernandes-sobreira/website/releases/download/suavez-v1/suavez.apk">Instalar no Android</a>
    <small>Depois de instalar, escolha a data da última aplicação e permita as notificações.<br>Sem login. Sem mensalidade. Seus dados só no celular.</small>
  </main>
</body>
</html>
